---
# Plans one landing zone, then applies that plan after approval. Each landing
# zone has its own tfvars file and its own state file, as Microsoft recommends.
name: Continuous Delivery
on:
  workflow_call:
    inputs:
      landing_zone:
        description: 'Landing zone name: matches landing-zones/<name>.tfvars'
        required: true
        type: string
      terraform_cli_version:
        default: '1.14.9'
        type: string

env:
  ARM_TENANT_ID: "${{ secrets.AZURE_TENANT_ID }}"
  ARM_SUBSCRIPTION_ID: "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
  ARM_USE_AZUREAD: true
  ARM_USE_OIDC: true

jobs:
  plan:
    name: Plan ${{ inputs.landing_zone }}
    runs-on: ubuntu-latest
    concurrency: tfstate-${{ inputs.landing_zone }}
    environment: vending-prod-plan
    permissions:
      id-token: write
      contents: read
    env:
      ARM_CLIENT_ID: "${{ secrets.AZURE_CLIENT_ID }}"
      TF_VAR_connectivity_subscription_id: ${{ secrets.SUBSCRIPTION_ID_CONNECTIVITY }}
      TF_VAR_budget_contact_emails: '["${{ secrets.BUDGET_CONTACT_EMAIL }}"]'
      PLAN_ENCRYPTION_KEY: ${{ secrets.PLAN_ENCRYPTION_KEY }}
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
          terraform_version: ${{ inputs.terraform_cli_version }}

      # Identifiers are secrets, so they're masked in this public repo's logs.
      # Each landing zone's subscription ID is in SUBSCRIPTION_ID_<NAME>.
      - name: Select the Subscription
        env:
          SUBSCRIPTION_ID_NONPROD: ${{ secrets.SUBSCRIPTION_ID_NONPROD }}
          SUBSCRIPTION_ID_PROD: ${{ secrets.SUBSCRIPTION_ID_PROD }}
          SUBSCRIPTION_ID_SANDBOX: ${{ secrets.SUBSCRIPTION_ID_SANDBOX }}
        run: |
          name="SUBSCRIPTION_ID_$(echo '${{ inputs.landing_zone }}' | tr '[:lower:]-' '[:upper:]_')"
          id="${!name}"
          if [ -z "$id" ]; then echo "::error::Set the repository secret $name"; exit 1; fi
          echo "TF_VAR_subscription_id=$id" >> "$GITHUB_ENV"

      - name: Terraform Init
        run: |
          terraform init \
          -backend-config="resource_group_name=${{ vars.BACKEND_AZURE_RESOURCE_GROUP_NAME }}" \
          -backend-config="storage_account_name=${{ vars.BACKEND_AZURE_STORAGE_ACCOUNT_NAME }}" \
          -backend-config="container_name=${{ vars.BACKEND_AZURE_STORAGE_ACCOUNT_CONTAINER_NAME }}" \
          -backend-config="key=${{ inputs.landing_zone }}.tfstate"

      # -detailed-exitcode: 0 = no changes, 1 = error, 2 = changes. Apply (and
      # its approval) only runs when there is something to change.
      - name: Terraform Plan
        id: plan
        run: |
          set +e
          terraform plan \
          -input=false \
          -var-file="landing-zones/${{ inputs.landing_zone }}.tfvars" \
          -out=tfplan \
          -detailed-exitcode
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then exit 1; fi
          echo "has_changes=$([ "$code" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Show the Plan for Review
        run: terraform show tfplan

      # Artifacts of a public repo can be downloaded by any signed-in GitHub
      # user, and a saved plan holds every input value, so only an encrypted
      # copy is published.
      - name: Encrypt the Plan
        if: steps.plan.outputs.has_changes == 'true'
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -salt -in tfplan -out tfplan.enc -pass env:PLAN_ENCRYPTION_KEY
          rm tfplan

      # The apply job uses this exact plan, so what you approve is what runs.
      - name: Publish Plan Artifact
        if: steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plan-${{ inputs.landing_zone }}
          include-hidden-files: true # .terraform.lock.hcl
          retention-days: 1
          path: |
            .
            !.git/**
            !.terraform/**

  apply:
    name: Apply ${{ inputs.landing_zone }}
    needs: plan
    if: needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    concurrency: tfstate-${{ inputs.landing_zone }}
    environment: vending-prod-apply
    permissions:
      id-token: write
      contents: read
    env:
      ARM_CLIENT_ID: "${{ secrets.AZURE_CLIENT_ID }}"
      PLAN_ENCRYPTION_KEY: ${{ secrets.PLAN_ENCRYPTION_KEY }}
      AZAPI_RETRY_GET_AFTER_PUT_MAX_TIME: "60m" # Management group permissions propagate slowly
    steps:
      - name: Download Plan Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plan-${{ inputs.landing_zone }}

      - name: Decrypt the Plan
        run: openssl enc -d -aes-256-cbc -pbkdf2 -in tfplan.enc -out tfplan -pass env:PLAN_ENCRYPTION_KEY

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
          terraform_version: ${{ inputs.terraform_cli_version }}

      - name: Terraform Init
        run: |
          terraform init \
          -backend-config="resource_group_name=${{ vars.BACKEND_AZURE_RESOURCE_GROUP_NAME }}" \
          -backend-config="storage_account_name=${{ vars.BACKEND_AZURE_STORAGE_ACCOUNT_NAME }}" \
          -backend-config="container_name=${{ vars.BACKEND_AZURE_STORAGE_ACCOUNT_CONTAINER_NAME }}" \
          -backend-config="key=${{ inputs.landing_zone }}.tfstate"

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan
