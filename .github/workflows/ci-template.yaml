---
# Plans one landing zone for review on a pull request. Nothing is applied.
name: Continuous Integration
on:
  workflow_call:
    inputs:
      landing_zone:
        description: 'Landing zone name: matches landing-zones/<name>.tfvars'
        required: true
        type: string
      terraform_cli_version:
        default: '1.14.9'
        type: string

env:
  ARM_TENANT_ID: "${{ secrets.AZURE_TENANT_ID }}"
  ARM_SUBSCRIPTION_ID: "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
  ARM_USE_AZUREAD: true
  ARM_USE_OIDC: true

jobs:
  plan:
    name: Plan ${{ inputs.landing_zone }}
    runs-on: ubuntu-latest
    concurrency: tfstate-${{ inputs.landing_zone }}
    environment: vending-prod-plan
    permissions:
      id-token: write
      contents: read
    env:
      ARM_CLIENT_ID: "${{ secrets.AZURE_CLIENT_ID }}"
      TF_VAR_connectivity_subscription_id: ${{ secrets.SUBSCRIPTION_ID_CONNECTIVITY }}
      TF_VAR_budget_contact_emails: '["${{ secrets.BUDGET_CONTACT_EMAIL }}"]'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
          terraform_version: ${{ inputs.terraform_cli_version }}

      # Identifiers are secrets, so they're masked in this public repo's logs.
      # Each landing zone's subscription ID is in SUBSCRIPTION_ID_<NAME>.
      - name: Select the Subscription
        env:
          SUBSCRIPTION_ID_NONPROD: ${{ secrets.SUBSCRIPTION_ID_NONPROD }}
          SUBSCRIPTION_ID_PROD: ${{ secrets.SUBSCRIPTION_ID_PROD }}
          SUBSCRIPTION_ID_SANDBOX: ${{ secrets.SUBSCRIPTION_ID_SANDBOX }}
        run: |
          name="SUBSCRIPTION_ID_$(echo '${{ inputs.landing_zone }}' | tr '[:lower:]-' '[:upper:]_')"
          id="${!name}"
          if [ -z "$id" ]; then echo "::error::Set the repository secret $name"; exit 1; fi
          echo "TF_VAR_subscription_id=$id" >> "$GITHUB_ENV"

      - name: Terraform Init
        run: |
          terraform init \
          -backend-config="resource_group_name=${{ vars.BACKEND_AZURE_RESOURCE_GROUP_NAME }}" \
          -backend-config="storage_account_name=${{ vars.BACKEND_AZURE_STORAGE_ACCOUNT_NAME }}" \
          -backend-config="container_name=${{ vars.BACKEND_AZURE_STORAGE_ACCOUNT_CONTAINER_NAME }}" \
          -backend-config="key=${{ inputs.landing_zone }}.tfstate"

      - name: Terraform Plan
        run: |
          terraform plan \
          -input=false \
          -var-file="landing-zones/${{ inputs.landing_zone }}.tfvars"
