---
name: 01 Vending Continuous Integration
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    outputs:
      landing_zones: ${{ steps.list.outputs.landing_zones }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
          terraform_version: '1.14.9'

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      # One plan per file in landing-zones/, so adding a landing zone is one new file.
      - name: List Landing Zones
        id: list
        run: echo "landing_zones=$(find landing-zones -name '*.tfvars' -printf '%f\n' | sed 's/\.tfvars$//' | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  plan:
    name: Plan
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        landing_zone: ${{ fromJSON(needs.validate.outputs.landing_zones) }}
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/landing-zone.yaml
    with:
      landing_zone: ${{ matrix.landing_zone }}
